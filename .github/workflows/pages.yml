name: Demo on GitHub Pages
on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Publishes the self-contained demo (npm run build:demo: the app with an in-browser stand-in for the API)
  # as the site's index page, so it can be tried without setting anything up.
  deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build the demo
      working-directory: frontend
      run: |
        npm ci
        npm run build:demo
        mkdir -p ../site
        cp dist/demo/restaurant-demo.html ../site/index.html
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v4
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v4
