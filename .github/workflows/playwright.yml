name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      # Throwaway SQL Server for the e2e run; the SA password only exists inside this job.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Test_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Test_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # Overrides the Windows-auth connection string in appsettings.json. Development supplies the
      # JWT key and the seeded staff accounts the tests log in with.
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=RestaurantDb;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True
      ASPNETCORE_ENVIRONMENT: Development
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Create and seed the database
      working-directory: backend
      run: |
        dotnet tool install --global dotnet-ef --version "10.*"
        dotnet build
        dotnet ef database update --no-build
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: frontend
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      working-directory: frontend
      run: npx playwright test
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
