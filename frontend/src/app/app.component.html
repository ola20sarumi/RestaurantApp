<nav class="navbar navbar-expand-lg app-navbar sticky-top" data-bs-theme="dark" (keydown.escape)="closeStaffMenu()">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/menu" aria-label="Restaurant">
      <span class="brand-mark"><i class="bi bi-fire"></i></span>
      <span class="brand-name">Restaurant</span>
    </a>

    <!-- Menu and Cart stay on the bar at every width; on phones they're icon-only. -->
    <ul class="navbar-nav flex-row ms-auto align-items-center">
      <li class="nav-item">
        <a class="nav-link" routerLink="/menu" routerLinkActive="active" aria-label="Menu">
          <i class="bi bi-book me-sm-1"></i><span class="d-none d-sm-inline">Menu</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link cart-link position-relative" routerLink="/cart" routerLinkActive="active"
           [attr.aria-label]="cart.count() > 0 ? 'Cart, ' + cart.count() + ' items' : 'Cart'">
          <i class="bi bi-bag me-sm-1"></i><span class="d-none d-sm-inline">Cart</span>
          @if (cart.count() > 0) {
            <!-- Keyed on the count so the badge is re-created, replaying its "pop", on every change. -->
            @for (count of [cart.count()]; track count) {
              <span class="badge rounded-pill bg-primary ms-sm-1">{{ count }}</span>
            }
          }
        </a>
      </li>
    </ul>

    @if (auth.session(); as session) {
      <!-- Below 992px the staff links fold into this menu; Bootstrap's collapse CSS shows it, no Bootstrap JS. -->
      <button type="button" class="navbar-toggler staff-toggler ms-1" (click)="toggleStaffMenu()"
              aria-controls="staff-nav" [attr.aria-expanded]="staffMenuOpen()" aria-label="Staff menu">
        <i class="bi" [class.bi-list]="!staffMenuOpen()" [class.bi-x-lg]="staffMenuOpen()"></i>
      </button>

      <div id="staff-nav" class="collapse navbar-collapse flex-grow-0" [class.show]="staffMenuOpen()">
        <!-- Any click in here (even on the current page's link, which doesn't navigate) folds the menu away. -->
        <ul class="navbar-nav staff-nav ms-lg-2" (click)="closeStaffMenu()">
          @if (session.role === 'Admin') {
            <li class="nav-item">
              <a class="btn btn-sm btn-outline-secondary" routerLink="/admin" routerLinkActive="active"
                 [routerLinkActiveOptions]="{ exact: true }">
                <i class="bi bi-pencil-square me-2 me-lg-1"></i>Admin
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-sm btn-outline-secondary" routerLink="/admin/reports" routerLinkActive="active">
                <i class="bi bi-graph-up me-2 me-lg-1"></i>Reports
              </a>
            </li>
          }
          <li class="nav-item">
            <a class="btn btn-sm btn-outline-secondary" routerLink="/cashier" routerLinkActive="active">
              <i class="bi bi-person-badge me-2 me-lg-1"></i>Cashier
            </a>
          </li>
          <li class="nav-item">
            <button type="button" class="btn btn-sm btn-link" (click)="logout()" [title]="'Signed in as ' + session.username">
              <i class="bi bi-box-arrow-right me-2 me-lg-1"></i>Sign out
              <span class="signed-in-as d-lg-none ms-auto">{{ session.username }}</span>
            </button>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>

<main class="container">
  <router-outlet />
</main>

<footer class="app-footer small">
  <div class="container py-3 d-flex flex-wrap justify-content-between gap-2">
    <span>&copy; {{ year }} Restaurant</span>
    @if (!auth.session()) {
      <a class="text-decoration-none" routerLink="/login">Staff login</a>
    }
  </div>
</footer>
