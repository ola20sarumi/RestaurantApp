<nav class="navbar navbar-expand bg-white border-bottom sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-brand d-flex align-items-center gap-2" routerLink="/menu">
      <i class="bi bi-shop"></i>
      <span>Restaurant</span>
    </a>

    <ul class="navbar-nav ms-auto align-items-center gap-1">
      <li class="nav-item">
        <a class="nav-link" routerLink="/menu" routerLinkActive="active">
          <i class="bi bi-book me-1"></i><span class="d-none d-sm-inline">Menu</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link position-relative" routerLink="/cart" routerLinkActive="active">
          <i class="bi bi-bag me-1"></i><span class="d-none d-sm-inline">Cart</span>
          @if (cart.count() > 0) {
            <span class="badge rounded-pill bg-primary ms-1">{{ cart.count() }}</span>
          }
        </a>
      </li>
      @if (auth.session(); as session) {
        @if (session.role === 'Admin') {
          <li class="nav-item ms-sm-2">
            <a class="btn btn-sm btn-outline-secondary" routerLink="/admin" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-pencil-square me-1"></i><span class="d-none d-sm-inline">Admin</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-outline-secondary" routerLink="/admin/reports" routerLinkActive="active">
              <i class="bi bi-graph-up me-1"></i><span class="d-none d-sm-inline">Reports</span>
            </a>
          </li>
        }
        <li class="nav-item" [class.ms-sm-2]="session.role !== 'Admin'">
          <a class="btn btn-sm btn-outline-secondary" routerLink="/cashier" routerLinkActive="active">
            <i class="bi bi-person-badge me-1"></i><span class="d-none d-sm-inline">Cashier</span>
          </a>
        </li>
        <li class="nav-item">
          <button type="button" class="btn btn-sm btn-link" (click)="logout()" [title]="'Signed in as ' + session.username">
            <i class="bi bi-box-arrow-right me-1"></i><span class="d-none d-sm-inline">Sign out</span>
          </button>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>

<footer class="container border-top py-3 small text-muted d-flex justify-content-between">
  <span>&copy; {{ year }} Restaurant</span>
  @if (!auth.session()) {
    <a class="link-secondary text-decoration-none" routerLink="/login">Staff login</a>
  }
</footer>
