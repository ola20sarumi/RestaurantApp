<header class="page-hero">
  <h1><i class="bi bi-lightning-charge-fill me-2"></i>Checkout</h1>
  <ol class="steps" aria-label="Order progress">
    <li class="done"><span class="step-dot"><i class="bi bi-check-lg"></i></span>Cart</li>
    <li class="active" aria-current="step"><span class="step-dot">2</span>Checkout</li>
    <li><span class="step-dot">3</span>Enjoy</li>
  </ol>
</header>

@if (cart.items().length === 0) {
  <div class="empty-state">
    <div class="empty-emoji" aria-hidden="true">🛍️</div>
    <p>Your cart is empty.</p>
    <div class="text-body-secondary mb-4">Add a few dishes first, then come back to check out.</div>
    <a routerLink="/menu" class="btn btn-primary btn-lg px-4">Browse the menu</a>
  </div>
} @else {
  <div class="row g-4">
    <!-- Form section -->
    <div class="col-md-7">
      <app-checkout-form [total]="cart.total()" [submitting]="isSubmitting()" [error]="error()"
                         (fulfillmentTypeChange)="error.set(null)" (placeOrder)="placeOrder($event)" />
    </div>

    <!-- Order summary sidebar -->
    <div class="col-md-5">
      <app-order-summary class="summary-sticky" [items]="cart.items()" [total]="cart.total()">
        <div class="receipt-note"><i class="bi bi-shield-check"></i>Secure payment with Paystack, or pay at the counter.</div>
        <a routerLink="/cart" class="btn btn-link px-0 mt-2 align-self-start"><i class="bi bi-arrow-left me-1"></i>Edit cart</a>
      </app-order-summary>
    </div>
  </div>
}
