<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <h1 class="h3 fw-bold mb-0"><i class="bi bi-person-badge me-2 text-brand"></i>Cashier dashboard</h1>

  <div class="d-flex flex-wrap align-items-center gap-2 controls">
    <select class="form-select form-select-sm" aria-label="Filter by status"
            [value]="statusFilter()" (change)="filterBy($any($event.target).value)">
      <option value="">All statuses</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
    <button type="button" class="btn btn-sm btn-outline-secondary text-nowrap" (click)="loadOrders()">
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
  </div>
</div>

@if (error()) {
  <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ error() }}</span>
  </div>
}

@if (loading()) {
  <div class="d-flex align-items-center gap-2 text-body-secondary py-5 justify-content-center">
    <div class="spinner-border spinner-border-sm" role="status"></div>
    <span>Loading orders…</span>
  </div>
} @else {
  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
    @for (order of orders(); track order.id) {
      <div class="col">
        <app-order-card [order]="order" (statusChange)="setStatus(order, $event)" (markPaid)="markPaid(order)" />
      </div>
    } @empty {
      <div class="col-12 text-center text-body-secondary py-5">
        <i class="bi bi-inbox display-4 d-block mb-3"></i>
        <p class="mb-0">No orders{{ statusFilter() ? ' with status ' + statusFilter() : '' }} yet.</p>
      </div>
    }
  </div>
}
