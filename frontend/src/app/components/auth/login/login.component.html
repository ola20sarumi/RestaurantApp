<div class="card border-0 shadow-sm mx-auto login-card">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-person-lock text-brand display-5 d-block mb-2"></i>
      <h1 class="h4 fw-bold mb-1">Staff sign in</h1>
      <p class="text-body-secondary small mb-0">For the menu admin and cashier pages.</p>
    </div>

    @if (wrongRole()) {
      <div class="alert alert-warning small" role="alert">
        You're signed in as <strong>{{ session()!.username }}</strong>, which can't open that page.
        Sign in with an account that can, or <button type="button" class="btn btn-link btn-sm p-0 align-baseline" (click)="logout()">sign out</button>.
      </div>
    }

    @if (error()) {
      <div class="alert alert-danger small" role="alert">{{ error() }}</div>
    }

    <form (ngSubmit)="login()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-control" autocomplete="username" autofocus
               [ngModel]="username()" (ngModelChange)="username.set($event)" [disabled]="submitting()">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password"
               [ngModel]="password()" (ngModelChange)="password.set($event)" [disabled]="submitting()">
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in…
        } @else {
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
        }
      </button>
    </form>
  </div>
</div>
